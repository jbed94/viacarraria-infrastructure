{{- if .Values.parsingWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "graph-app.fullname" . }}-parsing-worker
  labels:
    {{- include "graph-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: parsing-worker
spec:
  {{- if not .Values.parsingWorker.autoscaling.enabled }}
  replicas: {{ .Values.parsingWorker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: parsing-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: parsing-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "graph-app.fullname" . }}-app
      {{- end }}
      {{- with .Values.parsingWorker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.parsingWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.parsingWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.parsingWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: parsing-worker
          image: "{{ .Values.parsingWorker.image.repository }}:{{ .Values.parsingWorker.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: [python, -m, viacarraria_services.parsing_worker]
          {{- with .Values.parsingWorker.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "graph-app.fullname" . }}-runtime
          env:
            - name: BACKEND_API_URL
              value: http://{{ include "graph-app.fullname" . }}-backend:3000/api
            - name: TEI_URL
              value: http://{{ include "graph-app.fullname" . }}-embedding-engine:80
            - name: TEI_RERANK_URL
              value: http://{{ include "graph-app.fullname" . }}-reranking-engine:80
          {{- if or .Values.uploads.enabled (eq .Values.storage.driver "local") }}
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          {{- end }}
          resources:
            {{- toYaml .Values.parsingWorker.resources | nindent 12 }}
      {{- if or .Values.uploads.enabled (eq .Values.storage.driver "local") }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "graph-app.fullname" . }}-uploads
      {{- end }}
{{- end }}
---
{{- if and .Values.embeddingEngine.enabled .Values.embeddingEngine.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "graph-app.fullname" . }}-embedding-cache
  labels:
    {{- include "graph-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: embedding-engine
spec:
  accessModes:
    - {{ .Values.embeddingEngine.persistence.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.embeddingEngine.persistence.size | default "5Gi" }}
  {{- with .Values.embeddingEngine.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
{{- end }}
{{- if .Values.embeddingEngine.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "graph-app.fullname" . }}-embedding-engine
  labels:
    {{- include "graph-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: embedding-engine
spec:
  {{- if not .Values.embeddingEngine.autoscaling.enabled }}
  replicas: {{ .Values.embeddingEngine.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: embedding-engine
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: embedding-engine
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "graph-app.fullname" . }}-app
      {{- end }}
      {{- with .Values.embeddingEngine.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.embeddingEngine.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.embeddingEngine.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.embeddingEngine.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: embedding-engine
          image: "{{ .Values.embeddingEngine.image.repository }}:{{ .Values.embeddingEngine.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- with .Values.embeddingEngine.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --model-id
            - {{ .Values.embeddingEngine.modelId | default "sentence-transformers/all-MiniLM-L6-v2" | quote }}
            - --port
            - "80"
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: model-cache
              mountPath: /data
          resources:
            {{- toYaml .Values.embeddingEngine.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: model-cache
          {{- if .Values.embeddingEngine.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "graph-app.fullname" . }}-embedding-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "graph-app.fullname" . }}-embedding-engine
  labels:
    {{- include "graph-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: embedding-engine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: embedding-engine
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 80
      targetPort: http
      name: http
{{- end }}
---
{{- if and .Values.rerankingEngine.enabled .Values.rerankingEngine.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
