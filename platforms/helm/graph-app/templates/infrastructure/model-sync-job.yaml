{{- if .Values.modelSync.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "graph-app.fullname" . }}-model-sync
  labels:
    {{- include "graph-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-sync
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "1"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: model-sync
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: model-sync
          image: "{{ .Values.modelSync.image.repository }}:{{ .Values.modelSync.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for MinIO service to be ready..."
              python -c '
              import socket, time, sys
              for _ in range(30):
                  try:
                      s = socket.create_connection(("{{ include "graph-app.fullname" . }}-minio", 9000), timeout=2)
                      s.close()
                      print("MinIO is reachable.")
                      sys.exit(0)
                  except OSError:
                      time.sleep(2)
              print("Timeout waiting for MinIO")
              sys.exit(1)
              '
              python /app/download_models.py
              echo "Model synchronization job complete."
          envFrom:
            - secretRef:
                name: {{ include "graph-app.fullname" . }}-runtime
          env:
            - name: S3_ENDPOINT
              value: http://{{ include "graph-app.fullname" . }}-minio:9000
            - name: S3_BUCKET
              value: {{ .Values.modelSync.bucket | default "viacarraria-models" | quote }}
            - name: TEI_MODEL_ID
              value: {{ .Values.embeddingEngine.modelId | default "sentence-transformers/all-MiniLM-L6-v2" | quote }}
            - name: TEI_RERANK_MODEL_ID
              value: {{ .Values.rerankingEngine.modelId | default "BAAI/bge-reranker-base" | quote }}
            - name: MODELS_TO_SYNC
              value: "{{ .Values.embeddingEngine.modelId | default "sentence-transformers/all-MiniLM-L6-v2" }},{{ .Values.rerankingEngine.modelId | default "BAAI/bge-reranker-base" }}"
            - name: FORCE_MODEL_SYNC
              value: {{ .Values.modelSync.forceSync | default false | quote }}
          resources:
            {{- toYaml .Values.modelSync.resources | nindent 12 }}
{{- end }}
