{{- if and .Values.retention.cronJob.enabled .Values.backend.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "graph-app.fullname" . }}-retention-cron
  labels:
    {{- include "graph-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: retention-cron
spec:
  schedule: {{ .Values.retention.cronJob.schedule | default "0 3 * * *" | quote }}
  concurrencyPolicy: {{ .Values.retention.cronJob.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ .Values.retention.cronJob.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.retention.cronJob.failedJobsHistoryLimit | default 1 }}
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/component: retention-cron
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: retention-cron
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: OnFailure
          {{- with .Values.retention.cronJob.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: retention-runner
              image: "{{ .Values.retention.cronJob.image.repository }}:{{ .Values.retention.cronJob.image.tag }}"
              imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
              command:
                - /bin/sh
                - -c
                - |
                  echo "Triggering retention sweep via backend admin API..."
                  curl -fsS -X POST "http://{{ include "graph-app.fullname" . }}-backend:{{ .Values.backend.service.port }}/api/admin/retention/run" \
                    -H "Content-Type: application/json"
                  echo "Retention sweep triggered successfully."
              envFrom:
                - secretRef:
                    name: {{ include "graph-app.fullname" . }}-runtime
              resources:
                {{- toYaml .Values.retention.cronJob.resources | nindent 16 }}
{{- end }}
