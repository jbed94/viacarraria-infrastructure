{{- if or .Values.uploads.enabled (eq .Values.storage.driver "local") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "graph-app.fullname" . }}-uploads
  labels:
    {{- include "graph-app.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: {{ .Values.uploads.size }}
  {{- with .Values.uploads.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
---
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "graph-app.fullname" . }}-runtime
  labels:
    {{- include "graph-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "graph-app.databaseUrl" . | quote }}
  REDIS_URL: {{ include "graph-app.redisUrl" . | quote }}
  RABBITMQ_URL: {{ include "graph-app.rabbitmqUrl" . | quote }}
  BETTER_AUTH_URL: {{ required "secrets.betterAuthUrl is required" .Values.secrets.betterAuthUrl | quote }}
  BETTER_AUTH_SECRET: {{ required "secrets.betterAuthSecret is required" .Values.secrets.betterAuthSecret | quote }}
  FRONTEND_ORIGIN: {{ required "secrets.frontendOrigin is required" .Values.secrets.frontendOrigin | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | default "" | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | default "" | quote }}
  INTERNAL_SERVICE_TOKEN: {{ required "secrets.internalServiceToken is required" .Values.secrets.internalServiceToken | quote }}
  UPSTASH_REDIS_REST_URL: {{ .Values.secrets.upstashRedisRestUrl | default "" | quote }}
  UPSTASH_REDIS_REST_TOKEN: {{ .Values.secrets.upstashRedisRestToken | default "" | quote }}
  STORAGE_DRIVER: {{ .Values.storage.driver | default "s3" | quote }}
  {{- $s3Endpoint := .Values.storage.s3.endpoint | default "" }}
  {{- $s3AccessKey := .Values.storage.s3.accessKey | default "" }}
  {{- $s3SecretKey := .Values.storage.s3.secretKey | default "" }}
  {{- $s3ForcePathStyle := .Values.storage.s3.forcePathStyle | default "true" }}
  {{- if .Values.minio.enabled }}
  {{- $s3Endpoint = printf "http://%s-minio:9000" (include "graph-app.fullname" .) }}
  {{- $s3AccessKey = .Values.minio.auth.rootUser }}
  {{- $s3SecretKey = .Values.minio.auth.rootPassword }}
  {{- $s3ForcePathStyle = "true" }}
  {{- end }}
  S3_ENDPOINT: {{ $s3Endpoint | quote }}
  S3_REGION: {{ .Values.storage.s3.region | default "us-east-1" | quote }}
  S3_BUCKET: {{ .Values.storage.s3.bucket | default "viacarraria-sources" | quote }}
  S3_ACCESS_KEY: {{ $s3AccessKey | quote }}
  S3_SECRET_KEY: {{ $s3SecretKey | quote }}
  S3_FORCE_PATH_STYLE: {{ $s3ForcePathStyle | quote }}
  S3_PUBLIC_URL: {{ .Values.storage.s3.publicUrl | default "" | quote }}
  S3_ABORT_INCOMPLETE_DAYS: {{ (((.Values.storage).s3).lifecycle).abortIncompleteMultipartDays | default 1 | quote }}
  S3_TRANSITION_IA_DAYS: {{ (((.Values.storage).s3).lifecycle).transitionIaDays | default 0 | quote }}
  S3_TRANSITION_GLACIER_DAYS: {{ (((.Values.storage).s3).lifecycle).transitionGlacierDays | default 0 | quote }}
  WEAVIATE_HTTP_URL: {{ include "graph-app.weaviateHttpUrl" . | quote }}
  WEAVIATE_GRPC_HOST: {{ include "graph-app.weaviateGrpcHost" . | quote }}
  WEAVIATE_GRPC_PORT: {{ .Values.weaviate.grpcPort | default "50051" | quote }}
  WEAVIATE_PQ_ENABLED: {{ .Values.weaviate.productQuantization.enabled | default false | quote }}
  WEAVIATE_PQ_TRAINING_LIMIT: {{ .Values.weaviate.productQuantization.trainingLimit | default 10000 | quote }}
  WEAVIATE_PQ_SEGMENTS: {{ .Values.weaviate.productQuantization.segments | default 64 | quote }}
  GRAPH_INACTIVITY_RETENTION_DAYS: {{ (((.Values.retention).inactivityDays) | default 90) | quote }}
  GRAPH_RETENTION_GRACE_PERIOD_DAYS: {{ (((.Values.retention).gracePeriodDays) | default 7) | quote }}
  GRAPH_RETENTION_SCHEDULE_INTERVAL_HOURS: {{ (((.Values.retention).scheduleIntervalHours) | default 24) | quote }}
  GRAPH_RETENTION_AUTO_PURGE_ENABLED: {{ (((.Values.retention).autoPurgeEnabled) | default true) | quote }}
{{- end }}