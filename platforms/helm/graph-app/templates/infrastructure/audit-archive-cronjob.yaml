{{- if and .Values.auditArchival.cronJob.enabled .Values.backend.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "graph-app.fullname" . }}-audit-archive-cron
  labels:
    {{- include "graph-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-archive-cron
spec:
  schedule: {{ .Values.auditArchival.cronJob.schedule | default "0 2 * * *" | quote }}
  concurrencyPolicy: {{ .Values.auditArchival.cronJob.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ .Values.auditArchival.cronJob.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.auditArchival.cronJob.failedJobsHistoryLimit | default 1 }}
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/component: audit-archive-cron
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: audit-archive-cron
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: OnFailure
          {{- with .Values.auditArchival.cronJob.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: audit-archive-runner
              image: "{{ .Values.auditArchival.cronJob.image.repository }}:{{ .Values.auditArchival.cronJob.image.tag }}"
              imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
              command:
                - /bin/sh
                - -c
                - |
                  echo "Triggering audit log cold storage archival via backend API..."
                  KEY_HEADER=""
                  if [ -n "$ADMIN_KEY" ]; then
                    KEY_HEADER="-H \"X-Admin-Key: $ADMIN_KEY\""
                  fi
                  eval curl -fsS -X POST "\"http://{{ include "graph-app.fullname" . }}-backend:{{ .Values.backend.service.port }}/api/admin/audit-logs/archive\"" \
                    -H "\"Content-Type: application/json\"" \
                    $KEY_HEADER \
                    -d '\'{"olderThanDays": {{ .Values.auditArchival.olderThanDays | default 7 }}, "retainCount": {{ .Values.auditArchival.retainActiveCount | default 100 }}}\''
                  echo "Audit log cold storage archival completed."
              envFrom:
                - secretRef:
                    name: {{ include "graph-app.fullname" . }}-runtime
              resources:
                {{- toYaml .Values.auditArchival.cronJob.resources | nindent 16 }}
{{- end }}
