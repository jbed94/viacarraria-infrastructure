{{- if .Values.weaviate.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "graph-app.fullname" . }}-weaviate
  labels:
    {{- include "graph-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: weaviate
spec:
  serviceName: {{ include "graph-app.fullname" . }}-weaviate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: weaviate
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: weaviate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: weaviate
          image: "{{ .Values.weaviate.image.repository }}:{{ .Values.weaviate.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          env:
            - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
              value: {{ .Values.weaviate.anonymousAccess | default "true" | quote }}
            - name: PERSISTENCE_DATA_PATH
              value: /var/lib/weaviate
            - name: DEFAULT_VECTORIZER_MODULE
              value: none
            - name: CLUSTER_HOSTNAME
              value: node1
            - name: QUERY_DEFAULTS_LIMIT
              value: "25"
            {{- if .Values.weaviate.productQuantization.enabled }}
            - name: ENABLE_PRODUCT_QUANTIZATION
              value: "true"
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/weaviate
          resources:
            {{- toYaml .Values.weaviate.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /v1/.well-known/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/.well-known/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "graph-app.labels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.weaviate.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.weaviate.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "graph-app.fullname" . }}-weaviate
  labels:
    {{- include "graph-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: weaviate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: weaviate
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 8080
      targetPort: http
      name: http
    - port: 50051
      targetPort: grpc
      name: grpc
{{- end }}
