{{- if or .Values.parsingWorker.autoscaling.enabled .Values.embeddingEngine.autoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "graph-app.fullname" . }}-rabbitmq-auth
  labels:
    {{- include "graph-app.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: host
      name: {{ include "graph-app.fullname" . }}-runtime
      key: RABBITMQ_URL
---
{{- end }}
{{- if .Values.parsingWorker.autoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "graph-app.fullname" . }}-parsing-worker
  labels:
    {{- include "graph-app.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "graph-app.fullname" . }}-parsing-worker
  minReplicaCount: {{ .Values.parsingWorker.autoscaling.minReplicaCount | default 0 }}
  maxReplicaCount: {{ .Values.parsingWorker.autoscaling.maxReplicaCount | default 10 }}
  pollingInterval: {{ .Values.parsingWorker.autoscaling.pollingInterval | default 15 }}
  cooldownPeriod: {{ .Values.parsingWorker.autoscaling.cooldownPeriod | default 60 }}
  triggers:
    - type: rabbitmq
      metadata:
        queueName: {{ .Values.parsingWorker.autoscaling.queueName | default "document_parsing_queue" | quote }}
        mode: QueueLength
        value: {{ .Values.parsingWorker.autoscaling.queueLength | default "1" | quote }}
      authenticationRef:
        name: {{ include "graph-app.fullname" . }}-rabbitmq-auth
---
{{- end }}
{{- if .Values.embeddingEngine.autoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "graph-app.fullname" . }}-embedding-engine
  labels:
    {{- include "graph-app.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "graph-app.fullname" . }}-embedding-engine
  minReplicaCount: {{ .Values.embeddingEngine.autoscaling.minReplicaCount | default 0 }}
  maxReplicaCount: {{ .Values.embeddingEngine.autoscaling.maxReplicaCount | default 3 }}
  pollingInterval: {{ .Values.embeddingEngine.autoscaling.pollingInterval | default 15 }}
  cooldownPeriod: {{ .Values.embeddingEngine.autoscaling.cooldownPeriod | default 120 }}
  triggers:
    - type: rabbitmq
      metadata:
        queueName: {{ .Values.embeddingEngine.autoscaling.queueName | default "document_parsing_queue" | quote }}
        mode: QueueLength
        value: {{ .Values.embeddingEngine.autoscaling.queueLength | default "1" | quote }}
      authenticationRef:
        name: {{ include "graph-app.fullname" . }}-rabbitmq-auth
{{- end }}