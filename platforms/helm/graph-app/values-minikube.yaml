################################################################################
# Via Carraria Helm Values - Local Minikube Profile
#
# Optimized for self-contained execution inside a local Minikube cluster:
# - In-cluster PostgreSQL, Redis, RabbitMQ, Weaviate, and MinIO enabled
# - Ingress configured for Minikube NGINX addon (minikube addons enable ingress)
# - Host resolution via 'viacarraria.local'
# - Downscaled CPU/RAM requests to run efficiently within 8GB RAM
# - Database migrations automatically deploy and seed demonstration graphs
################################################################################

global:
  imagePullPolicy: IfNotPresent

secrets:
  create: true
  databaseUrl: "postgresql://postgres:minikubepassword@viacarraria-graph-app-postgresql:5432/viacarraria"
  redisUrl: "redis://:minikubepassword@viacarraria-graph-app-redis:6379"
  rabbitMqUrl: "amqp://rabbitmq:minikubepassword@viacarraria-graph-app-rabbitmq.viacarraria.svc.cluster.local:5672"
  betterAuthUrl: "http://viacarraria.local"
  betterAuthSecret: "local-minikube-auth-secret-32-chars-long-rnd!"
  frontendOrigin: "http://viacarraria.local,http://192.168.1.89:8080,http://100.122.139.123:8080,http://jcore:8080,http://localhost:8080,http://192.168.1.89,http://100.122.139.123,http://jcore.tail7756e6.ts.net:8080,https://jcore.tail7756e6.ts.net,https://jcore.tail7756e6.ts.net:8443,https://jcore:8443"
  internalServiceToken: "local-internal-token-for-services-auth"

uploads:
  enabled: true
  storageClass: "standard"
  size: 2Gi

storage:
  driver: s3
  s3:
    endpoint: "http://viacarraria-graph-app-minio:9000"
    region: "us-east-1"
    bucket: "viacarraria-sources"
    accessKey: "minioadmin"
    secretKey: "minikubepassword"
    forcePathStyle: "true"
    publicUrl: "http://viacarraria.local/minio"
    lifecycle:
      abortIncompleteMultipartDays: 1
      transitionIaDays: 0
      transitionGlacierDays: 0

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  certManager:
    enabled: false
  tls:
    enabled: false
  hosts:
    - host: viacarraria.local
      paths:
        - path: /api
          pathType: Prefix
          serviceName: backend
          servicePort: 3000
        - path: /socket.io
          pathType: Prefix
          serviceName: backend
          servicePort: 3000
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80
    - host: jcore
      paths:
        - path: /api
          pathType: Prefix
          serviceName: backend
          servicePort: 3000
        - path: /socket.io
          pathType: Prefix
          serviceName: backend
          servicePort: 3000
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80
    - host: jcore.tail7756e6.ts.net
      paths:
        - path: /api
          pathType: Prefix
          serviceName: backend
          servicePort: 3000
        - path: /socket.io
          pathType: Prefix
          serviceName: backend
          servicePort: 3000
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80
    - host: ""
      paths:
        - path: /api
          pathType: Prefix
          serviceName: backend
          servicePort: 3000
        - path: /socket.io
          pathType: Prefix
          serviceName: backend
          servicePort: 3000
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80
    - host: localhost
      paths:
        - path: /api
          pathType: Prefix
          serviceName: backend
          servicePort: 3000
        - path: /socket.io
          pathType: Prefix
          serviceName: backend
          servicePort: 3000
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80

networkPolicy:
  enabled: false

frontend:
  enabled: true
  replicaCount: 1
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
  securityContext:
    allowPrivilegeEscalation: true
    capabilities:
      add:
        - CHOWN
        - SETUID
        - SETGID
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 60
  pdb:
    enabled: false

admin:
  enabled: false

backend:
  enabled: true
  replicaCount: 1
  env:
    nodeEnv: development
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 768Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 50
  pdb:
    enabled: false

parsingWorker:
  enabled: true
  replicaCount: 0
  autoscaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 4
    pollingInterval: 5
    cooldownPeriod: 20
    queueName: "document_parsing_queue"
    queueLength: "1"
    tagMatchingQueueName: "tag_matching_queue"
    tagMatchingQueueLength: "1"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1536Mi

embeddingEngine:
  enabled: true
  replicaCount: 0
  autoscaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 3
    pollingInterval: 5
    cooldownPeriod: 20
    queueName: "document_parsing_queue"
    queueLength: "1"
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 2048Mi

rerankingEngine:
  enabled: false # Dense search via embeddingEngine is active; reranker can be enabled on demand
  replicaCount: 0
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 300m
      memory: 1024Mi
    limits:
      cpu: 2000m
      memory: 4096Mi

databaseMigrate:
  enabled: true
  image:
    repository: viacarraria/database-migrate
    tag: latest
  seed: true
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Self-Hosted In-Cluster Infrastructure for Minikube
postgresql:
  enabled: true
  auth:
    database: viacarraria
    username: postgres
    password: "minikubepassword"
  persistence:
    storageClass: "standard"
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  enabled: true
  auth:
    password: "minikubepassword"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

rabbitmq:
  enabled: true
  auth:
    username: rabbitmq
    password: "minikubepassword"
  persistence:
    storageClass: "standard"
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

weaviate:
  enabled: true
  anonymousAccess: "true"
  productQuantization:
    enabled: false
  persistence:
    storageClass: "standard"
    size: 4Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1536Mi

minio:
  enabled: true
  auth:
    rootUser: "minioadmin"
    rootPassword: "minikubepassword"
  persistence:
    storageClass: "standard"
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  createBuckets: false

# Inactive Graph & Resource Retention Policies
retention:
  inactivityDays: 90
  gracePeriodDays: 7
  scheduleIntervalHours: 24
  autoPurgeEnabled: true
  cronJob:
    enabled: false
    schedule: "0 3 * * *"
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
    image:
      repository: curlimages/curl
      tag: "8.12.1"
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

