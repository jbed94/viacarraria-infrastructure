name: viacarraria

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - graph-infra

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - graph-infra

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, check_running]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - graph-infra

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.32.4
    restart: unless-stopped
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      CLUSTER_HOSTNAME: node1
      DEFAULT_VECTORIZER_MODULE: none
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: "25"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    volumes:
      - weaviate-data:/var/lib/weaviate
    networks:
      - graph-infra

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graph-infra

  minio-create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-viacarraria-sources}
      STORAGE_UPSTREAM_PROVIDER: ${STORAGE_UPSTREAM_PROVIDER:-none}
      UPSTREAM_S3_ENDPOINT: ${UPSTREAM_S3_ENDPOINT:-https://s3.amazonaws.com}
      UPSTREAM_S3_REGION: ${UPSTREAM_S3_REGION:-us-east-1}
      UPSTREAM_S3_BUCKET: ${UPSTREAM_S3_BUCKET:-}
      UPSTREAM_S3_ACCESS_KEY: ${UPSTREAM_S3_ACCESS_KEY:-}
      UPSTREAM_S3_SECRET_KEY: ${UPSTREAM_S3_SECRET_KEY:-}
      UPSTREAM_GCS_BUCKET: ${UPSTREAM_GCS_BUCKET:-}
      UPSTREAM_GCS_CREDENTIALS_FILE: ${UPSTREAM_GCS_CREDENTIALS_FILE:-/etc/minio/gcs-key.json}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${S3_BUCKET:-viacarraria-sources};
      if [ \"$${STORAGE_UPSTREAM_PROVIDER}\" = \"s3\" ] && [ -n \"$${UPSTREAM_S3_BUCKET}\" ]; then
        echo \"Configuring MinIO storage proxy tier to AWS S3 ($${UPSTREAM_S3_BUCKET})...\";
        mc ilm tier add s3 local UPSTREAM_S3 --endpoint \"$${UPSTREAM_S3_ENDPOINT}\" --access-key \"$${UPSTREAM_S3_ACCESS_KEY}\" --secret-key \"$${UPSTREAM_S3_SECRET_KEY}\" --bucket \"$${UPSTREAM_S3_BUCKET}\" --region \"$${UPSTREAM_S3_REGION}\" || true;
        mc ilm rule add --tier UPSTREAM_S3 --transition-days 0 local/$${S3_BUCKET:-viacarraria-sources} || true;
      elif [ \"$${STORAGE_UPSTREAM_PROVIDER}\" = \"gcs\" ] && [ -n \"$${UPSTREAM_GCS_BUCKET}\" ]; then
        echo \"Configuring MinIO storage proxy tier to Google Cloud Storage ($${UPSTREAM_GCS_BUCKET})...\";
        mc ilm tier add gcs local UPSTREAM_GCS --credentials-file \"$${UPSTREAM_GCS_CREDENTIALS_FILE}\" --bucket \"$${UPSTREAM_GCS_BUCKET}\" || true;
        mc ilm rule add --tier UPSTREAM_GCS --transition-days 0 local/$${S3_BUCKET:-viacarraria-sources} || true;
      fi;
      echo \"MinIO storage proxy initialized successfully.\";
      exit 0;
      "
    networks:
      - graph-infra

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  weaviate-data:
  minio-data:

networks:
  graph-infra:
    name: graph_infra_net